<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121520"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Top Floating Tab Bar -->
  <rect x="595" y="42" width="730" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="678" y="82" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600">Home</text>
  <text x="795" y="82" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600">Explore</text>
  <text x="920" y="82" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600">Library</text>
  <text x="1038" y="82" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600">Now Playing</text>
  <circle cx="1220" cy="74" r="24" fill="#FFFFFF" fill-opacity="0.20"/>
  <text x="1220" y="81" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" text-anchor="middle">Q</text>

  <!-- Left Pane: Non-IME Query Bar + Custom D-Pad Keyboard -->
  <rect x="96" y="156" width="760" height="840" rx="30" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- Query Display Box (NEVER focuses Android Native IME!) -->
  <rect x="136" y="196" width="680" height="74" rx="20" fill="#0B0E17" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <text x="172" y="242" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600">hotel cali</text>
  <rect x="303" y="216" width="3" height="34" rx="1.5" fill="#818CF8"/>
  <text x="780" y="240" fill="#64748B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" text-anchor="end">No system keyboard</text>

  <!-- Action Strip: Space, Backspace, Clear, 123 -->
  <g transform="translate(136, 296)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <rect x="0" y="0" width="210" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.10"/><text x="105" y="38" fill="#E2E8F0">Space</text>
    <rect x="224" y="0" width="150" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.10"/><text x="299" y="38" fill="#E2E8F0">Delete</text>
    <rect x="388" y="0" width="136" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.10"/><text x="456" y="38" fill="#E2E8F0">Clear</text>
    <rect x="538" y="0" width="142" height="60" rx="14" fill="#4F46E5"/><text x="609" y="38" fill="#FFFFFF">Search</text>
  </g>

