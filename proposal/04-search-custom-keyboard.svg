    <rect x="115" y="384" width="102" height="84" rx="16" fill="#FFFFFF" fill-opacity="0.08"/><text x="166" y="436" fill="#FFFFFF">Z</text>
    <rect x="230" y="384" width="102" height="84" rx="16" fill="#FFFFFF" fill-opacity="0.08"/><text x="281" y="436" fill="#CBD5E1">1</text>
    <rect x="345" y="384" width="102" height="84" rx="16" fill="#FFFFFF" fill-opacity="0.08"/><text x="396" y="436" fill="#CBD5E1">2</text>
    <rect x="460" y="384" width="102" height="84" rx="16" fill="#FFFFFF" fill-opacity="0.08"/><text x="511" y="436" fill="#CBD5E1">3</text>
    <rect x="575" y="384" width="102" height="84" rx="16" fill="#FFFFFF" fill-opacity="0.08"/><text x="626" y="436" fill="#CBD5E1">123</text>
