<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Timeless Smoked-Glass Backdrop -->
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131722"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>

    <!-- Subtle Ambient Backlight (Calm, Non-Metallic) -->
    <radialGradient id="glow3" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft, Understated Glass Outer Rim -->
    <linearGradient id="rim3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>

    <!-- High-Contrast Frosted Liquid Glass Pill Fill -->
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#EEF6FF" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#DCE8FF" stop-opacity="0.78"/>
    </linearGradient>

    <!-- Subtle, Timeless Glass Edge (Reduced Metallic Reflection) -->
    <linearGradient id="pillRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg3)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow3)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="url(#rim3)" stroke-width="2"/>

  <!-- 5 High-Contrast Frosted Liquid-Glass Sound Pills -->
  <!-- Centered at (256, 256) and strictly within Android's 66dp adaptive-icon safe zone (r <= 149px of 156px max) -->
  <!-- Bar 1 (Left) -->
  <rect x="125" y="224" width="38" height="104" rx="19" fill="url(#pillFill)" stroke="url(#pillRim)" stroke-width="1.5"/>
  <!-- Bar 2 (Mid-Left, High) -->
  <rect x="181" y="152" width="38" height="166" rx="19" fill="url(#pillFill)" stroke="url(#pillRim)" stroke-width="1.5"/>
  <!-- Bar 3 (Center, Tallest) -->
  <rect x="237" y="132" width="38" height="248" rx="19" fill="url(#pillFill)" stroke="url(#pillRim)" stroke-width="1.5"/>
  <!-- Bar 4 (Mid-Right, Low) -->
  <rect x="293" y="194" width="38" height="166" rx="19" fill="url(#pillFill)" stroke="url(#pillRim)" stroke-width="1.5"/>
  <!-- Bar 5 (Right) -->
  <rect x="349" y="184" width="38" height="104" rx="19" fill="url(#pillFill)" stroke="url(#pillRim)" stroke-width="1.5"/>
</svg>
