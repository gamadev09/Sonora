<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#05070C"/>
    </linearGradient>
  </defs>

  <!-- Dimmed App Backdrop -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="#000000" fill-opacity="0.55"/>

  <!-- Centered Hardware Capability Dialog -->
  <rect x="460" y="210" width="1000" height="660" rx="36" fill="#151926" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Amber Hardware Badge -->
  <circle cx="960" cy="312" r="44" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="2"/>
  <text x="960" y="328" fill="#FBBF24" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="middle">!</text>

  <!-- Title & Explanation -->
  <text x="960" y="410" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle">This TV May Struggle with Sing</text>
  <text x="960" y="460" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" text-anchor="middle">Real-time vocal separation and Automix require significant RAM and CPU.</text>
  <text x="960" y="496" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" text-anchor="middle">Enabling this on lower-memory TVs may cause slow loading or audio stutter.</text>

  <!-- Detected Hardware Pill -->
  <rect x="615" y="538" width="690" height="72" rx="18" fill="#0B0E17" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="960" y="582" fill="#E2E8F0" font-family="Consolas, monospace" font-size="21" text-anchor="middle">Detected: 904 MB RAM · 32-bit ARM (armeabi-v7a)</text>

  <!-- Action Buttons -->
  <!-- Recommended (Focused White Platter) -->
  <rect x="550" y="658" width="820" height="74" rx="20" fill="#FFFFFF"/>
  <text x="960" y="704" fill="#0B0E17" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Keep Off (Recommended)</text>

  <!-- Override Option -->
  <rect x="550" y="750" width="820" height="70" rx="20" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="960" y="793" fill="#E2E8F0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Enable Anyway</text>
</svg>
